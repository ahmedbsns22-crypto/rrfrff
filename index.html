<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aroma Ladies Spa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500&family=Cormorant+Garamond:wght@300;500&display=swap">
<style>
:root{--bg:#18181b;--gold:#dcc7a1;--rose:#cf9f93;--gray:#b4b4b9;--ivory:#f1ebe0;--ease:cubic-bezier(.22,.8,.25,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0b0c;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:"Tajawal","Segoe UI",sans-serif}
body.playing{cursor:none}
.stage{position:relative;width:min(100vw,56.25vh);aspect-ratio:9/16;container-type:size;overflow:hidden;
  background:radial-gradient(ellipse at 50% 38%,#26252a 0%,var(--bg) 62%,#111113 100%);color:var(--ivory)}
.reset *{transition:none!important}
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scene.on{opacity:1}
.w{display:inline-block;opacity:0;transform:translateY(2.2cqw);transition:opacity .9s ease,transform .9s var(--ease);margin:0 .13em;will-change:transform,opacity}
.w.in{opacity:1;transform:none}
.ul{position:relative;display:inline-block;transition:transform 1.4s var(--ease)}
.ul::after{content:"";position:absolute;right:.1em;left:.1em;bottom:-.12em;height:max(2px,.35cqw);background:currentColor;transform:scaleX(0);transform-origin:right center;transition:transform 1.3s var(--ease)}
.ul.draw::after{transform:scaleX(1)}
.ul.draw.zin{transform:scale(1.06)}
.gold{color:var(--gold)}.rose{color:var(--rose)}.gray{color:var(--gray)}
/* scene 1 */
#s1 .q{font-family:"Amiri",serif;font-size:7.6cqw;line-height:1.85;text-align:center;width:82cqw;font-weight:400}
/* scenes 2-3 */
.pic{position:relative;width:76cqw;aspect-ratio:1;isolation:isolate;opacity:0;transition:opacity 1.2s ease,transform 1.8s var(--ease);will-change:transform,opacity}
.pic::after{content:"";position:absolute;inset:0;border:1px solid rgba(220,199,161,.38);z-index:-1}
.ph{position:absolute;inset:0;overflow:hidden;background:#222}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1);transition:transform 9s linear;will-change:transform}
.ph img.zoom{transform:scale(1.07)}
#s2 .pic{align-self:flex-start;margin-inline-start:7cqw;transform:translateX(34cqw)}
#s2 .pic::after{transform:translate(-2.6cqw,2.6cqw)}
#s3 .pic{align-self:flex-end;margin-inline-end:7cqw;transform:translateX(-34cqw)}
#s3 .pic::after{transform:translate(2.6cqw,2.6cqw)}
.pic.in{opacity:1;transform:none!important}
.cap{margin-top:11cqw;text-align:center;width:80cqw;font-family:"Amiri",serif;font-size:6.2cqw;line-height:1.9}
.cap.sub{margin-top:2.5cqw;font-size:5.2cqw;line-height:1.6;margin-top:3cqw}
#s3 .cap{font-size:5.9cqw}
/* scene 4 */
#s4{gap:0}
.f{opacity:0;transform:translateY(2cqw);transition:opacity 1.2s ease,transform 1.2s var(--ease)}
.f.in{opacity:1;transform:none}
.logo{margin-bottom:5cqw;text-align:center;transform:scale(.95)}
.logo.in{transform:scale(1)}
.logo img{width:56cqw;display:block}
.wm{direction:ltr;font-family:"Cormorant Garamond",serif;color:var(--gold);font-weight:500;font-size:15cqw;letter-spacing:.26em;line-height:1;padding-left:.26em}
.wm small{display:block;margin-top:3.2cqw;font-size:4.2cqw;letter-spacing:.7em;color:var(--ivory);font-weight:300;padding-left:.7em}
.rule{width:30cqw;height:max(1px,.3cqw);background:var(--gold);transform:scaleX(0);transition:transform 1.4s var(--ease);margin:2cqw 0 5cqw}
.rule.in{transform:scaleX(1)}
.lux{direction:ltr;font-family:"Cormorant Garamond",serif;font-size:4.6cqw;letter-spacing:.3em;color:var(--rose);text-transform:uppercase;padding-left:.3em}
.tag{font-family:"Amiri",serif;font-size:6cqw;margin-top:11cqw;text-align:center;line-height:1.8}
.book{margin-top:12cqw;font-size:3.9cqw;color:var(--gray);font-weight:300;letter-spacing:.06em}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;position:relative;margin-top:2.5cqw;font-size:8.6cqw;letter-spacing:.14em;color:var(--gold);font-weight:300;padding-left:.14em}
.num::after{content:"";position:absolute;left:0;right:0;bottom:-1.6cqw;height:max(1px,.3cqw);background:var(--gold);transform:scaleX(0);transform-origin:left center;transition:transform 1.4s var(--ease)}
.num.draw::after{transform:scaleX(1)}
/* start overlay */
#start{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:rgba(11,11,12,.88);z-index:5;transition:opacity .4s}
#start.hide{opacity:0;pointer-events:none}
#start button{font:500 18px "Tajawal",sans-serif;color:#18181b;background:var(--gold);border:0;padding:14px 36px;border-radius:2px;cursor:pointer;letter-spacing:.04em}
#start p{color:#8d8d92;font-size:13px}
</style>
</head>

      <span class="ul gold" id="k1"><span class="w">الراحة؟</span></span>

<div id="start">
  <button id="go">ابدأ العرض</button>
  <p>Space / Click = تشغيل &nbsp;·&nbsp; R = إعادة</p>
</div>

<script>
// ضع هنا رابط/Data URI الشعار الرسمي ليظهر بدل الشعار النصي المؤقت
const LOGO_SRC = "";

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const stage = $('#stage');
let timers = [], running = false;
const at = (ms, fn) => timers.push(setTimeout(fn, ms));
const add = (sel, ms, cls = 'in') => at(ms, () => $$(sel).forEach(e => e.classList.add(cls)));
const rem = (sel, ms, cls = 'on') => at(ms, () => $$(sel).forEach(e => e.classList.remove(cls)));
const words = (root, start, step) => $$(root + ' .w').forEach((w, i) => at(start + i * step, () => w.classList.add('in')));
const draw = (sel, ms) => at(ms, () => $(sel).classList.add('draw', 'zin'));

// logo
$('#logo').innerHTML = LOGO_SRC
  ? '<img src="' + LOGO_SRC + '" alt="Aroma Ladies Spa">'
  : '<div class="wm">AROMA<small>LADIES SPA</small></div>';

function reset() {
  timers.forEach(clearTimeout); timers = [];
  stage.classList.add('reset');
  $$('.on,.in,.draw,.zin,.zoom').forEach(e => e.classList.remove('on', 'in', 'draw', 'zin', 'zoom'));
  void stage.offsetWidth;
  stage.classList.remove('reset');
}

function play() {
  reset(); running = true;
  $('#start').classList.add('hide'); document.body.classList.add('playing');

  // المشهد 1
  add('#s1', 400, 'on');
  words('#s1', 1000, 330);
  draw('#k1', 4500);
  rem('#s1', 7600);

  // المشهد 2
  add('#s2', 8600, 'on');
  add('#p1', 8800);
  at(8900, () => $('#p1 img').classList.add('zoom'));
  words('#c2', 10200, 340);
  at(11900, () => $$('#s2 .sub .w')[0].classList.add('in'));
  at(12250, () => $$('#s2 .sub .w')[1].classList.add('in'));
  draw('#k2', 12900);
  rem('#s2', 15600);

  // المشهد 3
  add('#s3', 16600, 'on');
  add('#p2', 16800);
  at(16900, () => $('#p2 img').classList.add('zoom'));
  words('#c3', 18100, 300);
  draw('#k3', 20400);
  draw('#k4', 21300);
  rem('#s3', 24600);

  // المشهد الأخير
  add('#s4', 25600, 'on');
  add('#logo', 25800);
  add('#rule', 27000);
  add('#lux', 27500);
  add('#tag', 28700);
  add('#book', 30300);
  add('#numw', 30900);
  at(31700, () => $('#num').classList.add('draw'));
  at(37000, () => { running = false; });
}

$('#go').onclick = play;
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!running) play(); }
  if (e.key === 'r' || e.key === 'R') play();
});
</script>
